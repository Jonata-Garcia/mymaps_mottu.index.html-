:root{
  color-scheme:dark;
  --mottu-bg:#121212; --mottu-surface:#272727; --mottu-surface-2:#4F4F4F;
  --mottu-green:#00B131; --mottu-green-70:#1BD60B; --mottu-lime:#A2FF00;
  --mottu-green-soft:rgba(0,177,49,0.16); --mottu-green-line:rgba(0,177,49,0.45);
  --text-primary:#F7F7F7; --text-secondary:#C4C4C4; --text-muted:#8F8F8F; --text-faint:#5C5C5C;
  --gridline:rgba(255,255,255,0.08); --border:#4F4F4F;
  --status-normal:#8F8F8F; --status-warning:#EF6800; --status-critical:#FF5449; --status-info:#6FA8FF;
  --radius-card:20px; --radius-md:8px;
  --font-display:'Barlow', sans-serif; --font-body:'Ubuntu', system-ui, sans-serif;

  --sig-gps:#FF5449; --sig-ping:#2ECC71; --sig-cel:#409EFF; --sig-ticket:#14B8A6;
  --sig-multa:#FF4D4D; --sig-cbd:#FF9F40; --sig-bo:#FFCE00; --sig-face:#BA55FF;
  --sig-ping-fg:#86E6AD; --sig-cel-fg:#9ECBFF; --sig-ticket-fg:#5EEAD4;
  --sig-multa-fg:#FF9D9D; --sig-cbd-fg:#FFCA8A; --sig-bo-fg:#FFE066; --sig-face-fg:#D9A3FF;
  --sig-time:#86E6AD;
  --gestores:#FF6F00;

  --bg:#0B0C0B;
  
  --bg-image:none;
  --glass:#161917; --glass-2:#1B1F1C; --glass-3:#212622;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --hub-h:76px;
  --ease:cubic-bezier(.25,1,.5,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ scroll-behavior:smooth; }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text-primary); font-family:var(--font-body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--mottu-green); outline-offset:2px; border-radius:6px; }
.tnum{ font-variant-numeric:tabular-nums; }


.bg{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(900px 520px at 8% -12%, rgba(0,177,49,.10), transparent 60%),
    var(--bg-image) center / cover no-repeat,
    var(--bg);
}
.bg canvas{ position:absolute; inset:0; width:100%; height:100%; }
.bg::after{ content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 60%, transparent 45%, rgba(0,0,0,.6) 100%); }


.li{ display:inline-grid; place-items:center; flex:none; line-height:0; }
.li svg{ width:var(--is,18px); height:var(--is,18px); fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
.li-thick svg{ stroke-width:2.75; }
.li .draw{ stroke-dasharray:1; stroke-dashoffset:0; }
.li *{ transform-box:fill-box; transform-origin:center; }
.ai:hover .li-search svg, .li-search.live svg{ animation:liSearch 1s var(--ease); }
@keyframes liSearch{ 0%,100%{ transform:none; } 33%{ transform:translate(0,-4px); } 66%{ transform:translate(-3px,0); } }
.li-copy .a, .li-copy .b{ transition:transform .35s var(--spring); }
.ai:hover .li-copy .a{ transform:translate(-3px,-3px); } .ai:hover .li-copy .b{ transform:translate(3px,3px); }
.li-send .a{ transition:transform .5s var(--ease); transform-origin:12px 12px; transform-box:view-box; }
.ai:hover .li-send .a{ transform:translate(3px,-3px) scale(.8); }
.li-send .trail{ stroke-dasharray:2 2; stroke-width:1; opacity:0; transition:opacity .3s; }
.ai:hover .li-send .trail{ opacity:1; }
.ai:hover .li-pin svg, .li-pin.live svg{ animation:liPinBounce .5s var(--ease); }
@keyframes liPinBounce{ 0%{ transform:none; } 60%{ transform:translateY(-5px); } 100%{ transform:translateY(-3px); } }
.ai:hover .li-pin .draw, .ai:hover .li-draw .draw, .li-draw.live .draw{ animation:liDraw .5s .2s var(--ease) both; }
@keyframes liDraw{ from{ stroke-dashoffset:1; opacity:0; } 20%{ opacity:1; } to{ stroke-dashoffset:0; opacity:1; } }
.ai:hover .li-tower .arc, .li-tower.live .arc, .ai:hover .li-nfc .arc, .li-nfc.live .arc, .ai:hover .li-dish .arc, .li-dish.live .arc{ animation:liArc 1.1s var(--ease) both; }
.li .arc.d1{ animation-delay:.1s !important; } .li .arc.d2{ animation-delay:.2s !important; }
@keyframes liArc{ 0%{ opacity:1; } 30%{ opacity:0; } 60%,100%{ opacity:1; } }
.ai:hover .li-msg .dot, .li-msg.live .dot{ animation:liDots 1.5s linear both; }
.li-msg .dot.d1{ animation-delay:.15s; } .li-msg .dot.d2{ animation-delay:.3s; }
@keyframes liDots{ 0%,10%{ opacity:1; } 15%,30%{ opacity:0; } 35%,55%{ opacity:1; } 60%,75%{ opacity:0; } 80%,100%{ opacity:1; } }
.ai:hover .li-badge svg, .li-badge.live svg{ animation:liWiggle .5s ease-in-out; }
@keyframes liWiggle{ 0%,100%{ transform:none; } 20%{ transform:scale(1.1) rotate(-3deg); } 40%{ transform:scale(1.1) rotate(3deg); } 60%{ transform:scale(1.1) rotate(-2deg); } 80%{ transform:rotate(2deg); } }
.ai:hover .li-eye .lid, .li-eye.live .lid{ animation:liBlink .4s ease-in-out; }
.ai:hover .li-eye .iris, .li-eye.live .iris{ animation:liIris .4s ease-in-out; }
@keyframes liBlink{ 50%{ transform:scaleY(.1); opacity:.3; } }
@keyframes liIris{ 50%{ transform:scale(.3); opacity:.3; } }
.ai:hover .li-file .ln, .li-file.live .ln{ animation:liLine .7s ease-in-out both; }
.li-file .ln.d1{ animation-delay:.2s; } .li-file .ln.d2{ animation-delay:.4s; }
@keyframes liLine{ 0%{ stroke-dashoffset:0; } 45%{ stroke-dashoffset:1; } 100%{ stroke-dashoffset:0; } }
.ai:hover .li-face .corner, .li-face.live .corner{ animation:liCorner .7s var(--spring); }
.ai:hover .li-face .mouth, .li-face.live .mouth{ animation:liMouth .7s ease; }
@keyframes liCorner{ 45%{ transform:scale(1.2) rotate(45deg); opacity:0; } }
@keyframes liMouth{ 45%{ transform:scale(.8); opacity:0; } }
.ai:hover .li-flame .draw, .li-flame.live .draw{ animation:liDraw .6s var(--ease) both; }
.li-hourglass g{ transition:transform .6s var(--spring); transform-origin:12px 12px; transform-box:view-box; }
.ai:hover .li-hourglass g{ transform:rotate(180deg); }
.li-gauge .needle{ transition:transform .45s var(--spring); transform-origin:12px 14px; transform-box:view-box; }
.ai:hover .li-gauge .needle{ transform:rotate(72deg); }
.li-pie .slice{ transition:transform .35s var(--spring); }
.ai:hover .li-pie .slice{ transform:translate(1.1px,-1.1px); }
.li-refresh svg{ transition:transform .5s var(--spring); }
.ai:hover .li-refresh svg{ transform:rotate(50deg); }
.ai:hover .li-users .mate{ animation:liMate .5s var(--spring); }
@keyframes liMate{ from{ transform:translateX(-4px); opacity:0; } }
.ai:hover .li-trend svg{ animation:liTrend .5s ease; }
@keyframes liTrend{ 50%{ transform:translate(2px,var(--ty,-2px)); } }
.ai:hover .li-trend .draw{ animation:liDraw .45s var(--ease) both; }
.li-timer .hand{ transition:transform .6s cubic-bezier(.4,0,.2,1); transform-origin:12px 14px; transform-box:view-box; }
.ai:hover .li-timer .hand{ transform:rotate(300deg); }
.ai:hover .li-check .draw, .li-check.live .draw{ animation:liDraw .4s var(--ease) both; }
.li-chev svg{ transition:transform .25s var(--ease); }

const __WEBHOOK_URL = "https://webhook-n8n-int.mottu.io/webhook/carteira-v2";

const __SENHA_HEADER = "x-carteira-senha";

let __senhaAtual = "";

function __gateErro(msg) {
  const el = document.getElementById("gateErro");
  el.textContent = msg;
  el.hidden = !msg;
}

function __gateCarregando(etapa, det) {
  const card = document.querySelector(".gate-card"), load = document.getElementById("gateLoad");
  if (etapa == null) {
    card.classList.remove("carregando");
    load.hidden = true;
    return;
  }
  card.classList.add("carregando");
  load.hidden = false;
  document.getElementById("gateEtapa").textContent = etapa;
  document.getElementById("gateDet").textContent = det || "";
}

const __mb = n => (n / 1048576).toLocaleString("pt-BR", {
  minimumFractionDigits: 1,
  maximumFractionDigits: 1
}) + " MB";

async function __lerComProgresso(resp) {
  const total = resp.headers.get("content-encoding") ? 0 : Number(resp.headers.get("content-length")) || 0;
  if (!resp.body || !resp.body.getReader) return resp.text();
  const leitor = resp.body.getReader(), partes = [];
  let lidos = 0;
  for (;;) {
    const {done, value} = await leitor.read();
    if (done) break;
    partes.push(value);
    lidos += value.length;
    __gateCarregando("Abrindo a carteira", total && lidos <= total ? `${__mb(lidos)} de ${__mb(total)} · ${Math.round(lidos / total * 100)}%` : `${__mb(lidos)} recebidos`);
  }
  const buf = new Uint8Array(lidos);
  let pos = 0;
  for (const p of partes) {
    buf.set(p, pos);
    pos += p.length;
  }
  return new TextDecoder("utf-8").decode(buf);
}

const __pintar = () => new Promise((r => requestAnimationFrame((() => setTimeout(r, 30)))));

async function __gateEntrar() {
  const input = document.getElementById("gateSenha"), btn = document.getElementById("gateBtn"), senha = input.value;
  if (!senha) {
    __gateErro("Digite a senha.");
    return;
  }
  __gateErro("");
  btn.disabled = true;
  __gateCarregando("Validando acesso", "Conectando ao n8n pela VPN");
  let resp, ok = false;
  try {
    resp = await fetch(__WEBHOOK_URL, {
      method: "POST",
      headers: {
        [__SENHA_HEADER]: senha
      }
    });
  } catch (err) {
    console.error("[carteira] falha de rede (VPN ou CORS):", err);
    __gateCarregando(null);
    __gateErro("Não foi possível falar com o n8n. Confira se está na VPN da Mottu. Se estiver, o bloqueio pode ser de CORS (Allowed Origins do webhook).");
    btn.disabled = false;
    return;
  }
  try {
    if (resp.status === 401 || resp.status === 403) {
      __gateErro("Senha incorreta.");
      return;
    }
    if (!resp.ok) {
      __gateErro("O n8n respondeu com erro " + resp.status + ". Veja a execução do webhook no n8n.");
      return;
    }
    __gateCarregando("Abrindo a carteira");
    const texto = await __lerComProgresso(resp);
    let json;
    try {
      json = JSON.parse(texto);
    } catch (err) {
      __gateErro("O n8n respondeu sem um JSON válido. Veja a execução do webhook no n8n.");
      return;
    }

      __gateErro("O n8n respondeu sem dados. O cache do OneDrive pode estar vazio ou corrompido.");
      return;
    }
    __gateCarregando("Montando o painel", `${dados.DATA.length} placas`);
    await __pintar();
    __senhaAtual = senha;
    await __iniciarAppComDados(dados);
    ok = true;
    document.getElementById("gate").remove();
    document.body.classList.remove("gate-on");
  } catch (err) {
    console.error("[carteira] erro ao montar o dashboard:", err);

  } finally {
    if (!ok) {
      __gateCarregando(null);
      btn.disabled = false;
    }
  }
}

document.getElementById("gateBtn").addEventListener("click", __gateEntrar);
